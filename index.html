<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Agent Builder Track</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a study notebook for the wire. Sticky top bar, lesson index on the left (drawer on phones),
   one reading column, and a tutor panel that slides in from the right (full screen on phones). */
:root {
  --bg: #F3F5F8;
  --surface: #FFFFFF;
  --sunk: #E8ECF1;
  --ink: #14202B;
  --muted: #566573;
  --line: #D6DDE4;
  --accent: #1D5BC4;
  --accent-ink: #FFFFFF;
  --accent-soft: #E1EAF8;
  --trap: #A64B0A;
  --trap-soft: #FBEADB;
  --ok: #1B7449;
  --ok-soft: #DDF0E5;
  --bad: #B0281F;
  --bad-soft: #F8E2DF;
  --wire-bg: #101C26;
  --wire-ink: #D5E1EA;
  --wire-key: #8EC0FF;
  --wire-str: #F2C27E;
  --wire-dim: #7D909E;
  --wire-line: #22323F;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 10px;
  --top-h: 56px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D141B; --surface: #141E28; --sunk: #1A2633; --ink: #E3EAF0; --muted: #94A4B1; --line: #263544;
    --accent: #6FA4F7; --accent-ink: #0A1420; --accent-soft: #19293F;
    --trap: #F2A466; --trap-soft: #35231A; --ok: #5FC892; --ok-soft: #14301F; --bad: #F08B80; --bad-soft: #3A1C1A;
    --wire-bg: #08111A; --wire-ink: #D5E1EA; --wire-key: #8EC0FF; --wire-str: #F2C27E; --wire-dim: #6F8392; --wire-line: #1C2B38;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D141B; --surface: #141E28; --sunk: #1A2633; --ink: #E3EAF0; --muted: #94A4B1; --line: #263544;
  --accent: #6FA4F7; --accent-ink: #0A1420; --accent-soft: #19293F;
  --trap: #F2A466; --trap-soft: #35231A; --ok: #5FC892; --ok-soft: #14301F; --bad: #F08B80; --bad-soft: #3A1C1A;
  --wire-bg: #08111A; --wire-ink: #D5E1EA; --wire-key: #8EC0FF; --wire-str: #F2C27E; --wire-dim: #6F8392; --wire-line: #1C2B38;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 17px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
a { color: var(--accent); text-underline-offset: 3px; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.15; text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
code { font-family: var(--font-mono); font-size: 0.86em; background: var(--sunk); padding: 0.08em 0.35em; border-radius: 5px; overflow-wrap: anywhere; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0; }

/* Top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { height: var(--top-h); display: flex; align-items: center; gap: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { font-family: var(--font-display); font-weight: 800; font-size: 18px; color: var(--ink); text-decoration: none; letter-spacing: -0.02em; white-space: nowrap; }
.top-prog { margin-left: auto; display: flex; align-items: center; gap: 10px; font-family: var(--font-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.top-prog .bar { width: 90px; }
.icon-btn { appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink); width: 40px; height: 40px; border-radius: 9px; display: inline-grid; place-items: center; cursor: pointer; flex: none; }
.icon-btn:hover { background: var(--sunk); }
.icon-btn svg { width: 20px; height: 20px; }

/* Shell */
.shell { display: grid; grid-template-columns: 1fr; }
.side { position: fixed; z-index: 25; top: calc(env(safe-area-inset-top, 0px) + var(--top-h)); bottom: 0; left: 0; width: min(330px, 88vw); background: var(--surface); border-right: 1px solid var(--line); overflow-y: auto; transform: translateX(-102%); transition: transform 0.22s ease; padding: 14px 12px calc(24px + env(safe-area-inset-bottom, 0px)); padding-left: max(12px, env(safe-area-inset-left, 0px)); }
.side.open { transform: none; }
.scrim { position: fixed; inset: 0; z-index: 24; background: rgb(8 14 20 / 0.45); }
@media (min-width: 980px) {
  .shell { grid-template-columns: 300px minmax(0, 1fr); }
  .side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--top-h)); height: calc(100vh - var(--top-h) - env(safe-area-inset-top, 0px)); transform: none; width: auto; z-index: 1; }
  #menuBtn { display: none; }
  .scrim { display: none; }
}

/* Nav */
.nav-home { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 8px; color: var(--ink); text-decoration: none; font-weight: 700; }
.nav-home[aria-current="page"], .nav-lesson[aria-current="page"], .nav-phase-link[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.nav-phase { margin-top: 6px; border-top: 1px solid var(--line); padding-top: 6px; }
.nav-phase summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 26px 1fr auto; gap: 8px; align-items: baseline; padding: 8px 10px; border-radius: 8px; }
.nav-phase summary::-webkit-details-marker { display: none; }
.nav-phase summary:hover { background: var(--sunk); }
.nav-pn { font-family: var(--font-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.nav-pt { font-weight: 700; font-size: 15px; line-height: 1.3; }
.nav-pc { font-family: var(--font-mono); font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.nav-pc.full { color: var(--ok); }
.nav-list { list-style: none; margin: 2px 0 6px; padding: 0; }
.nav-phase-link, .nav-lesson { display: grid; grid-template-columns: 26px 1fr; gap: 8px; padding: 6px 10px 6px 10px; border-radius: 8px; text-decoration: none; color: var(--ink); font-size: 14.5px; line-height: 1.35; }
.nav-phase-link { color: var(--muted); }
.nav-lesson:hover, .nav-phase-link:hover { background: var(--sunk); }
.nav-ln { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); padding-top: 2px; font-variant-numeric: tabular-nums; }
.nav-lesson.done .nav-ln { color: var(--ok); }
.sync { font-size: 13px; color: var(--muted); margin: 16px 10px 0; line-height: 1.4; }
.sync::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 7px; background: var(--muted); vertical-align: 1px; }
.sync.synced::before { background: var(--ok); }
.sync.offline::before { background: var(--trap); }

/* Main column */
.main { min-width: 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px calc(64px + env(safe-area-inset-bottom, 0px)); }
.main:focus { outline: none; }
.col { max-width: 720px; margin: 0 auto; display: grid; gap: 28px; }
body.tutor-open .main { padding-right: max(16px, env(safe-area-inset-right, 0px)); }
@media (min-width: 1240px) { body.tutor-open .main { margin-right: 420px; } }

.bar { height: 6px; border-radius: 99px; background: var(--sunk); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width 0.3s ease; }
.bar.ok > i { background: var(--ok); }

.btn { appearance: none; font: inherit; font-weight: 700; font-size: 15px; border-radius: 9px; padding: 10px 16px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; }
.btn:hover { background: var(--sunk); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.07); background: var(--accent); }
.btn.ghost { background: transparent; }
.btn[disabled] { opacity: 0.5; cursor: default; }
.btn-row { display: flex; flex-wrap: wrap; gap: 10px; }

/* Home */
.hero { display: grid; gap: 14px; padding-top: 8px; }
.hero h1 { font-size: clamp(36px, 8vw, 58px); font-weight: 800; letter-spacing: -0.035em; }
.lede { font-size: 19px; color: var(--muted); margin: 0; max-width: 60ch; }
.overall { display: grid; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
.overall-top { display: flex; justify-content: space-between; gap: 12px; font-variant-numeric: tabular-nums; flex-wrap: wrap; }
.overall-top strong { font-family: var(--font-display); font-size: 22px; }
.overall-top span { color: var(--muted); font-size: 15px; }
.steps4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--surface); }
.steps4 div { padding: 14px; border-left: 1px solid var(--line); min-width: 0; }
.steps4 div:first-child { border-left: 0; }
.steps4 b { display: block; font-family: var(--font-mono); font-size: 12px; color: var(--accent); margin-bottom: 4px; }
.steps4 span { font-size: 14.5px; line-height: 1.4; display: block; }
@media (max-width: 620px) { .steps4 { grid-template-columns: 1fr 1fr; } .steps4 div:nth-child(3) { border-left: 0; } .steps4 div:nth-child(n+3) { border-top: 1px solid var(--line); } }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
.sec-h h2 { font-size: 22px; }
.phase-rows { display: grid; gap: 0; border-top: 1px solid var(--line); }
.phase-row { display: grid; grid-template-columns: 44px minmax(0, 1fr) 96px; gap: 14px; align-items: center; padding: 14px 4px; border-bottom: 1px solid var(--line); text-decoration: none; color: var(--ink); }
.phase-row:hover { background: var(--surface); }
.phase-row .pn { font-family: var(--font-display); font-weight: 800; font-size: 28px; color: var(--accent); font-variant-numeric: tabular-nums; line-height: 1; }
.phase-row .pt { font-weight: 700; font-size: 17px; line-height: 1.3; }
.phase-row .pg { font-size: 14px; color: var(--muted); line-height: 1.4; margin-top: 2px; }
.phase-row .pm { display: grid; gap: 6px; font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.fine { font-size: 14px; color: var(--muted); margin: 0; }

/* Phase + lesson pages */
.crumbs { font-size: 14px; }
.crumbs a { color: var(--muted); text-decoration: none; }
.crumbs a:hover { color: var(--accent); }
.page-head { display: grid; gap: 10px; }
.page-head h1 { font-size: clamp(30px, 6vw, 44px); font-weight: 800; letter-spacing: -0.03em; }
.lnum { font-family: var(--font-display); font-weight: 800; color: var(--accent); font-size: clamp(44px, 10vw, 64px); line-height: 0.9; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
.meta { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: 14px; color: var(--muted); }
.chip { font-family: var(--font-mono); font-size: 11.5px; letter-spacing: 0.04em; padding: 3px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); text-decoration: none; white-space: nowrap; }
a.chip:hover { border-color: var(--accent); color: var(--accent); }
.chip.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.chip.exam { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.goal { font-size: 20px; font-weight: 700; line-height: 1.4; margin: 0; }
.prose { display: grid; gap: 14px; }
.prose p, .prose ul, .prose ol { margin: 0; max-width: 68ch; }
.prose ul, .prose ol { padding-left: 22px; display: grid; gap: 6px; }
.block h2 { font-size: 20px; margin-bottom: 12px; }
.keys ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 0; border-top: 1px solid var(--line); }
.keys li { padding: 10px 0 10px 28px; border-bottom: 1px solid var(--line); position: relative; }
.keys li::before { content: ""; position: absolute; left: 4px; top: 19px; width: 12px; height: 2px; background: var(--accent); }

.wire { background: var(--wire-bg); color: var(--wire-ink); border-radius: var(--radius); overflow: hidden; }
.wire-label { display: flex; gap: 10px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--wire-line); font-family: var(--font-mono); font-size: 11.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--wire-dim); }
.wire-label::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--wire-str); }
.wire pre { margin: 0; padding: 14px; overflow-x: auto; font-family: var(--font-mono); font-size: 13px; line-height: 1.6; }
.wire code { background: none; padding: 0; font-size: inherit; color: inherit; overflow-wrap: normal; }
.wire .k { color: var(--wire-key); } .wire .s { color: var(--wire-str); } .wire .c { color: var(--wire-dim); font-style: italic; }

.traps { display: grid; gap: 10px; }
.trap { display: grid; grid-template-columns: auto 1fr; gap: 12px; padding: 12px 14px; border-radius: var(--radius); background: var(--trap-soft); color: var(--ink); align-items: start; }
.trap b { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--trap); padding-top: 4px; }

.quiz { display: grid; gap: 16px; }
.qcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: grid; gap: 12px; }
.qnum { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.qtext { font-weight: 700; margin: 0; line-height: 1.45; }
.opts { display: grid; gap: 8px; }
.opt { appearance: none; font: inherit; text-align: left; padding: 11px 14px; border-radius: 9px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; line-height: 1.4; min-height: 44px; }
.opt:hover:not([disabled]) { border-color: var(--accent); }
.opt[disabled] { cursor: default; }
.opt.right { background: var(--ok-soft); border-color: var(--ok); }
.opt.wrong { background: var(--bad-soft); border-color: var(--bad); }
.why { margin: 0; font-size: 15px; padding-left: 12px; border-left: 3px solid var(--line); color: var(--muted); }
.why.r { border-color: var(--ok); } .why.w { border-color: var(--bad); }
.why strong { color: var(--ink); }
.qresult { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; padding: 14px 16px; background: var(--sunk); border-radius: var(--radius); }
.qresult strong { font-family: var(--font-display); font-size: 20px; font-variant-numeric: tabular-nums; }

.tutor-cta { display: grid; gap: 12px; padding: 18px; border-radius: var(--radius); border: 1px solid var(--accent); background: var(--accent-soft); }
.tutor-cta h2 { font-size: 20px; }
.tutor-cta p { margin: 0; }
.foot { display: grid; gap: 16px; border-top: 1px solid var(--line); padding-top: 20px; }
.donebtn[aria-pressed="true"] { background: var(--ok-soft); color: var(--ok); border-color: var(--ok); }
.pn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pn-row a { display: grid; gap: 2px; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--radius); text-decoration: none; color: var(--ink); background: var(--surface); min-width: 0; }
.pn-row a:hover { border-color: var(--accent); }
.pn-row a.next { text-align: right; grid-column: 2; }
.pn-row small { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); }
.pn-row span { font-weight: 700; font-size: 15px; line-height: 1.3; overflow-wrap: anywhere; }

.lesson-list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.lesson-list a { display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 4px; border-bottom: 1px solid var(--line); text-decoration: none; color: var(--ink); }
.lesson-list a:hover { background: var(--surface); }
.lesson-list .ln { font-family: var(--font-mono); font-size: 13px; color: var(--accent); font-variant-numeric: tabular-nums; }
.lesson-list .lt { font-weight: 700; line-height: 1.35; }
.lesson-list .lm { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; display: grid; gap: 12px; }
.panel h2 { font-size: 20px; }
.panel ol, .panel ul { margin: 0; padding-left: 22px; display: grid; gap: 8px; }
.links { list-style: none; padding: 0; margin: 0; display: grid; gap: 0; border-top: 1px solid var(--line); }
.links li { padding: 10px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.links li span { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.checklist { list-style: none; padding: 0; margin: 0; display: grid; gap: 0; }
.checklist label { display: grid; grid-template-columns: 24px 1fr; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); cursor: pointer; align-items: start; line-height: 1.45; }
.checklist input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--ok); }
.checklist input:checked + span { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line); }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 0; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.facts div { padding: 12px 14px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); margin: 0 -1px -1px 0; }
.facts b { display: block; font-family: var(--font-display); font-size: 22px; font-variant-numeric: tabular-nums; }
.facts span { font-size: 13px; color: var(--muted); }

/* Tutor */
.tutor { position: fixed; z-index: 40; inset: 0; background: var(--surface); display: grid; grid-template-rows: auto minmax(0, 1fr) auto; padding-top: env(safe-area-inset-top, 0px); }
@media (min-width: 760px) {
  .tutor { inset: calc(env(safe-area-inset-top, 0px) + var(--top-h)) 0 0 auto; width: 420px; border-left: 1px solid var(--line); padding-top: 0; box-shadow: -12px 0 32px rgb(10 20 30 / 0.10); }
}
.tutor-head { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; padding: 14px 16px; padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); }
.tutor-head h2 { font-size: 18px; margin-top: 2px; }
.tutor-log { overflow-y: auto; padding: 16px; padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 12px; }
.msg { max-width: 92%; padding: 10px 14px; border-radius: 12px; line-height: 1.5; font-size: 15.5px; overflow-wrap: anywhere; min-width: 0; }
.msg p { margin: 0 0 8px; } .msg p:last-child { margin-bottom: 0; }
.msg ul, .msg ol { margin: 0 0 8px; padding-left: 20px; }
.msg pre { background: var(--wire-bg); color: var(--wire-ink); padding: 10px; border-radius: 8px; overflow-x: auto; margin: 0 0 8px; font-size: 12.5px; }
.msg pre code { background: none; padding: 0; color: inherit; }
.msg.bot { align-self: flex-start; background: var(--sunk); }
.msg.me { align-self: flex-end; background: var(--accent); color: var(--accent-ink); }
.msg.me code { background: rgb(255 255 255 / 0.18); color: inherit; }
.msg.note { align-self: stretch; max-width: none; background: transparent; border: 1px dashed var(--line); color: var(--muted); font-size: 14.5px; }
.msg.thinking { color: var(--muted); font-style: italic; }
.tutor-form { border-top: 1px solid var(--line); padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 10px; }
.tutor-form textarea { font: inherit; font-size: 16px; width: 100%; resize: none; border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; background: var(--bg); color: var(--ink); min-height: 48px; max-height: 160px; }

    id: "0-1", t: "What an API is", min: 8,
    body: `<p>An API (application programming interface) is an agreement that lets one program ask another program for something. Your program is the <strong>client</strong>. The service it talks to is the <strong>server</strong>. The client sends a <strong>request</strong> saying what it wants, and the server sends back a <strong>response</strong> with the result or an error.</p>
<p>Think of ordering at a counter. The menu is the documentation: it tells you what you can ask for and how. Your order is the request. The food, or "sorry, we're out of that", is the response. You never need to see the kitchen.</p>
<p>Every agent you build is a chain of these exchanges. Your code calls the Claude API. Claude asks for a tool. The tool calls another API, like a CRM, a calendar or a database. When an agent misbehaves, the cause nearly always shows up in one of these requests or responses. That is why reading them is the core skill of this whole track, even when AI writes the code for you.</p>
<p>An <strong>SDK</strong> (software development kit) is a library, for example the Anthropic Python or TypeScript SDK, that builds and sends these requests for you. It is a convenience layer. Underneath, it sends exactly the same request a raw command would.</p>`,

    id: "0-2", t: "Anatomy of an HTTP request", min: 10,
    body: `<p>Most APIs travel over HTTP, the same protocol your browser uses to load pages. A request has four parts.</p>
<ul>
<li><strong>Method:</strong> the verb. <code>GET</code> reads, <code>POST</code> sends or creates, <code>PUT</code> and <code>PATCH</code> update, <code>DELETE</code> removes.</li>
<li><strong>URL (endpoint):</strong> where it goes. A base address plus a path, sometimes with query parameters after a <code>?</code>, like <code>?city=Cairo&units=metric</code>.</li>
<li><strong>Headers:</strong> metadata about the request. Who you are (the API key), what format the body is in, which version of the API you expect.</li>
<li><strong>Body:</strong> the payload, usually JSON. GET requests normally have no body.</li>
</ul>
<p>The Claude API uses one main endpoint, <code>POST /v1/messages</code>. It's a POST because you're sending a body: the model name, your instructions and the conversation so far. Three headers matter: <code>x-api-key</code> carries your key, <code>anthropic-version</code> pins the API version, and <code>content-type: application/json</code> says the body is JSON.</p>`,

{

    body: `<p>Every response starts with a three-digit status code. The first digit tells you whose problem it is.</p>
<ul>
<li><strong>2xx: success.</strong> <code>200 OK</code> is the one you'll see most.</li>
<li><strong>4xx: you sent something wrong.</strong> Retrying the same request won't help; change something first.</li>
<li><strong>5xx: the server had a problem.</strong> Waiting and retrying may work.</li>
</ul>
<p>The ones worth knowing by heart for Claude: <code>400</code> invalid request (read the message, it usually names the bad field), <code>401</code> bad or missing key, <code>403</code> key lacks permission, <code>404</code> wrong URL, <code>413</code> request too large, <code>429</code> rate limited (too many requests, slow down), <code>500</code> internal error, and <code>529</code> overloaded, which is Anthropic's signal that the service is busy.</p>
<p>The rule your code should follow: on a 4xx, fix the request. On 429, 500 or 529, wait and retry with <strong>exponential backoff</strong> (wait 1 second, then 2, then 4, and stop after a few tries). Error responses also carry a JSON body explaining what went wrong. Read it before guessing.</p>`,

<li><strong>Values:</strong> strings in double quotes, numbers, <code>true</code>/<code>false</code>, <code>null</code>, or another object or array.</li>

<p>To read a nested value you follow a path. <code>response.content[0].text</code> means: take the <code>content</code> key, then its first item, then that item's <code>text</code> key.</p>
<p>Common things that break JSON: single quotes, trailing commas, comments (JSON allows none) and unescaped double quotes inside a string.</p>
<p>One subtle point matters later for structured output: <code>null</code>, a missing key and an empty string <code>""</code> mean different things. <code>null</code> can say "I looked and this wasn't there", which is exactly what you want an extraction agent to say instead of inventing a value.</p>`,

<p>Agents add one more risk. An agent with a file-reading tool can read your <code>.env</code> file, and an agent that can send messages could leak what it reads. Give agents only the access they need. You'll apply the same rule to MCP configs in Phase 3, where tokens are referenced from environment variables instead of written into the file.</p>`,

    id: "1-1", t: "Anatomy of a Messages request", min: 10,
    body: `<p>Almost everything goes through one endpoint: <code>POST /v1/messages</code>. Three fields are required:</p>

<li><code>model</code>: which Claude model answers, such as <code>claude-sonnet-5-5</code>.</li>
<li><code>max_tokens</code>: the most Claude may write in its reply. It caps output only, not input.</li>
<li><code>messages</code>: the conversation, a list of turns. Each has a <code>role</code> (<code>user</code> or <code>assistant</code>) and <code>content</code>.</li>

<p>The optional fields you'll use most:</p>
<ul>
<li><code>system</code>: standing instructions for the whole conversation. Role, rules, tone, output format.</li>
<li><code>temperature</code>: randomness. Lower gives more consistent output.</li>
<li><code>tools</code> and <code>tool_choice</code>: the tools Claude may ask for, and whether it must (Phase 2).</li>
<li><code>stop_sequences</code>: strings that make Claude stop writing. <code>stream</code>: send the reply as it's written.</li>
</ul>
<p><code>content</code> can be a plain string or a list of <strong>content blocks</strong>: text, images, documents, and in agents, <code>tool_use</code> and <code>tool_result</code> blocks. That block structure is how tools fit into a normal conversation.</p>
<p>The <code>system</code> prompt frames the whole conversation. The <code>user</code> turn is the specific ask. Put rules that should hold every turn in <code>system</code>.</p>`,

<li>If it's <code>tool_use</code>: append Claude's response, run each requested tool, append a user message with all the results, go back to step 1.</li>
<li>If it's <code>end_turn</code>: return the final text. Done.</li>
</ol>
<p>Also handle <code>max_tokens</code> (the response was cut off) and <code>pause_turn</code> (send it back to continue).</p>
<p><strong><code>stop_reason</code> is the authoritative signal for when to stop.</strong> A safety cap, such as 20 or 50 iterations, is fine as a backstop against runaway loops, but it should never be how the agent normally ends.</p>

    body: `<p>When a tool fails, how you report it decides whether the agent recovers. "Operation failed" leaves Claude guessing. It may retry something that can never work, or give up on something that would work in a second.</p>
<p>A useful error result includes:</p>

    body: `<p>Before MCP, every AI app needed its own custom code for every integration. Five apps and ten services meant fifty integrations, each built and maintained separately.</p>
<p>MCP is an open standard. You build <strong>one server</strong> for a service, say your restaurant's ordering system, and <strong>any MCP-compatible host</strong> can use it: Claude Desktop, Claude Code, claude.ai connectors, and other vendors' apps. Think of it like USB-C for AI integrations.</p>

  {
    id: "4-1", t: "Workflows versus agents", min: 10,
    body: `<p>Two ways to build with LLMs:</p>
<ul>
<li><strong>Workflow:</strong> you define the steps in code. The model handles specific steps, like drafting or classifying. Predictable and cheaper.</li>
<li><strong>Agent:</strong> the model decides the steps and which tools to use, in a loop, based on what it finds. Flexible, but costs more, takes longer, and fails in less predictable ways.</li>
</ul>
<p>The building block of both is the <strong>augmented LLM</strong>: a model with tools, retrieval and memory.</p>
<p>Start with the simplest thing that works. Often a single well-prompted call with the right context is enough. Add a workflow when you can name the steps. Reach for an agent only when the steps can't be known in advance (open-ended research, debugging an unfamiliar system) and the value of the task justifies the cost.</p>
<p>The test question: <strong>can I write the steps down before I start?</strong> If yes, it's a workflow.</p>`,

    id: "4-2", t: "Workflow patterns", min: 12,
    body: `<p>Five patterns cover most systems.</p>
<ul>
<li><strong>Prompt chaining:</strong> a fixed sequence where each step's output feeds the next. Add a <em>gate</em> between steps that checks the output in code before continuing.</li>
<li><strong>Routing:</strong> classify the input, then send it to a specialised handler. Refund versus technical question. Or easy versus hard, with a cheap model for easy ones.</li>
<li><strong>Parallelisation:</strong> <em>sectioning</em> splits independent subtasks and runs them at once; <em>voting</em> runs the same task several times and compares.</li>
<li><strong>Orchestrator-workers:</strong> a central model breaks the task down at runtime and delegates to workers, then combines. Subtasks aren't known in advance. This is the bridge to multi-agent systems.</li>
<li><strong>Evaluator-optimiser:</strong> one model generates, another critiques against clear criteria, and they loop until the output passes.</li>

    body: `<p>The standard shape is <strong>hub and spoke</strong>. A coordinator agent receives the task, breaks it down, delegates pieces to subagents, collects their results, checks them, and writes the final output. Subagents don't talk to each other; everything goes through the coordinator. That gives you one place to observe, handle errors and control what information flows where.</p>

<p><strong>PreToolUse</strong> runs before a tool call. It can allow the call, block it (with a reason that goes back to Claude), or change its input. Uses:</p>

<li>block refunds over $500 and point Claude to the escalation tool</li>
<li>block file writes outside the project folder</li>
<li>block dangerous commands like <code>rm -rf</code></li>

<p><strong>PostToolUse</strong> runs after a tool returns and can transform the result before Claude sees it. Uses:</p>
<ul>
<li>normalise data: three systems return dates as a Unix timestamp, ISO text and "11/01/26"; convert all to one format so Claude compares correctly</li>
<li>trim verbose output to the fields that matter</li>
<li>redact personal data</li>
</ul>
<p>There are other events too, such as when the user submits a prompt, when a session starts and when the agent stops. The Claude Agent SDK exposes hooks as callbacks in your code. Claude Code configures them in <code>settings.json</code> as shell commands; a PreToolUse hook that exits with code 2 blocks the call.</p>`,

    body: `<p>Long tasks span sessions. Three options:</p>
<ul>
<li><strong>Resume</strong> a previous session (Claude Code's <code>--resume</code>, or a session id in the Agent SDK) to continue with the full history.</li>
<li><strong>Fork</strong> a session to explore two approaches from the same starting point without them interfering.</li>
<li><strong>Start fresh</strong> with a written summary of what's known.</li>
</ul>
<p>Resuming works when the earlier context is still true. If files changed since (you or a teammate edited code), the old tool results in the history are <strong>stale</strong>, and the agent will reason from outdated information. Either tell it exactly what changed and ask it to re-read those files, or start fresh with a summary.</p>
<p>Keep important state <strong>outside the conversation</strong>: a notes file of findings and decisions, a structured record of what's done and what's pending. Then a crash, a new session or another agent can pick up where things stopped. Coordinators can keep a manifest so a restarted coordinator can reload where each subagent got to.</p>`,

    body: `<p>Vague instructions like "be thorough", "only flag high-confidence issues" or "be conservative" don't change behaviour reliably. The model has to guess where your line is.</p>

    body: `<p>Agents resend the same large prefix (tools, system prompt, reference documents) on every loop. <strong>Prompt caching</strong> lets the API reuse that processed prefix, so repeated content is much cheaper and faster.</p>

<li>Mark a <strong>breakpoint</strong> with <code>cache_control</code> on a content block. Everything before it can be cached. Order matters: tools, then system, then messages.</li>
<li>A hit needs an <strong>exact prefix match</strong>. Change anything before the breakpoint, even a timestamp in the system prompt, and the cache misses.</li>

/* ---------- progress state ---------- */
const LS_KEY = "agent-builder-track-v1";
let P = { done: {}, quiz: {}, caps: {}, checks: {}, last: null };
function normalise(v) {
  v = v || {};
  return { done: v.done || {}, quiz: v.quiz || {}, caps: v.caps || {}, checks: v.checks || {}, last: v.last || null };
}
function loadLocal() { try { const v = JSON.parse(localStorage.getItem(LS_KEY) || "null"); if (v) P = normalise(v); } catch (e) {} }
function saveLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(P)); } catch (e) {} }

let dbRef = null, writeChain = Promise.resolve(), writeTimer = null;
// localSeq counts local changes; savedSeq is the last change confirmed in the account.
// While they differ, incoming account snapshots are older than what's on screen and are ignored.
let localSeq = 0, savedSeq = 0;
function save() {
  localSeq++;
  saveLocal();
  if (!dbRef) return;
  clearTimeout(writeTimer);
  writeTimer = setTimeout(() => {
    const seq = localSeq;
    const snap = JSON.parse(JSON.stringify(P));
    writeChain = writeChain
      .then(() => dbRef.set(snap))
      .then(() => { savedSeq = Math.max(savedSeq, seq); setSync("synced"); })
      .catch(() => setSync("offline"));
  }, 400);
}
function setSync(state) {
  const el = $("#syncNote");
  el.className = "sync " + state;
  el.textContent = {
    local: "Progress is saved on this device.",
    syncing: "Connecting to your account...",
    synced: "Progress syncs to your Claude account.",
    offline: "Can't reach your account right now. Saving on this device."
  }[state];
}
async function initSync() {
  if (!window.claude || !window.claude.use) { setSync("local"); return; }
  try {
    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    const uid = user ? await user.id() : null;
    if (!db || !uid) { setSync("local"); return; }
    dbRef = db.doc("data/users/" + uid + "/progress");
    setSync("syncing");
    let first = true;
    const timer = setTimeout(() => setSync("offline"), 10000);
    dbRef.onSnapshot(snap => {
      if (snap.metadata.hasPendingWrites) return;
      if (!snap.metadata.fromCache) { clearTimeout(timer); setSync("synced"); }
      const remote = snap.exists ? normalise(snap.data()) : null;
      if (first) {
        first = false;
        if (!remote) { if (Object.keys(P.done).length || Object.keys(P.quiz).length) save(); return; }
        const merged = {
          done: Object.assign({}, remote.done, P.done),
          quiz: Object.assign({}, P.quiz, remote.quiz),
          caps: Object.assign({}, remote.caps, P.caps),
          checks: Object.assign({}, remote.checks, P.checks),
          last: P.last || remote.last
        };
        const changed = JSON.stringify(merged) !== JSON.stringify(remote);
        P = merged; saveLocal(); refreshChrome();
        if (changed) save();
        return;
      }
      if (localSeq !== savedSeq) return;
      if (remote && JSON.stringify(remote) !== JSON.stringify(P)) { P = remote; saveLocal(); refreshChrome(); }
    }, () => setSync("offline"));
  } catch (e) { setSync("local"); }
}

function shuffleQuiz(l) {
  return l.q.map(([q, opts, a, why]) => {
    const order = opts.map((_, i) => i).sort(() => Math.random() - 0.5);
    return { q, why, opts: order.map(i => opts[i]), a: order.indexOf(a), picked: null };
  });
}
function commentStart(line) {
  let inQ = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (inQ) { if (ch === "\\") i++; else if (ch === '"') inQ = false; continue; }
    if (ch === '"') inQ = true;
    else if (ch === "/" && line[i + 1] === "/" && line[i - 1] !== ":") return i;
  }
  return -1;
}
function highlight(code) {
  return code.split("\n").map(line => {
    const t = line.trim();
    if (t.startsWith("//") || t.startsWith("# ")) return `<span class="c">${esc(line)}</span>`;
    const ci = commentStart(line);
    const body = ci >= 0 ? line.slice(0, ci) : line;
    let out = "", last = 0, m;
    const re = /"(?:[^"\\]|\\.)*"(\s*:)?/g;
    while ((m = re.exec(body))) {
      out += esc(body.slice(last, m.index));
      out += m[1] ? `<span class="k">${esc(m[0].slice(0, m[0].length - m[1].length))}</span>${esc(m[1])}` : `<span class="s">${esc(m[0])}</span>`;
      last = m.index + m[0].length;
    }
    out += esc(body.slice(last));
    return ci >= 0 ? out + `<span class="c">${esc(line.slice(ci))}</span>` : out;
  }).join("\n");
}

function md(text) {
  const blocks = [];
  let t = esc(text).replace(/```[a-zA-Z]*\n?([\s\S]*?)```/g, (_, c) => { blocks.push(`<pre><code>${c.replace(/\n$/, "")}</code></pre>`); return `\u0000${blocks.length - 1}\u0000`; });
  t = t.replace(/`([^`\n]+)`/g, "<code>$1</code>").replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
  const out = [];
  for (const para of t.split(/\n{2,}/)) {
    const lines = para.split("\n");
    if (lines.every(x => /^\s*([-*]|\d+\.)\s+/.test(x) || !x.trim())) {
      const ordered = /^\s*\d+\./.test(lines[0]);
      out.push(`<${ordered ? "ol" : "ul"}>${lines.filter(x => x.trim()).map(x => `<li>${x.replace(/^\s*([-*]|\d+\.)\s+/, "")}</li>`).join("")}</${ordered ? "ol" : "ul"}>`);
    } else if (/^\u0000\d+\u0000$/.test(para.trim())) out.push(para.trim());
    else out.push(`<p>${lines.join("<br>")}</p>`);
  }
  return out.join("").replace(/\u0000(\d+)\u0000/g, (_, i) => blocks[+i]);
}

async function call() {

  const sample = await getSample();

  const ctl = new AbortController(); T.ctl = ctl;
  const turns = T.turns.length > 22 ? [T.turns[0], ...T.turns.slice(-20)] : T.turns.slice();
  if (turns[1] && turns[1].role === "assistant") turns.splice(1, 0, { role: "user", content: "(earlier turns trimmed)" });
  try {
    const { text } = await sample(turns, {
      cache: false, signal: ctl.signal,
      onText: ({ text }) => { bubble.classList.remove("thinking"); bubble.innerHTML = md(text); $("#tutorLog").scrollTop = $("#tutorLog").scrollHeight; }
    });
    bubble.classList.remove("thinking"); bubble.innerHTML = md(text);
    T.turns.push({ role: "assistant", content: text });
  } catch (e) {
    const code = e && e.code;
    if (e && e.text && code !== "refused") { bubble.classList.remove("thinking"); bubble.innerHTML = md(e.text); T.turns.push({ role: "assistant", content: e.text }); }
    else bubble.remove();

    else if (code === "rate_limited") addMsg("note", "You've hit a usage limit for now. Try again in a little while.");
    else if (code === "session_expired") addMsg("note", "Your Claude session expired. Sign in again, then send your message.");
    else if (code === "refused") addMsg("note", "The tutor couldn't answer that. Try rephrasing.");
    else if (code !== "cancelled") addMsg("note", "The tutor didn't respond. Send your message again to retry.");
  } finally { if (T.ctl === ctl) T.ctl = null; setBusy(false); }
}
function sendUser(text) {

  addMsg("me", md(text));
  T.turns.push({ role: "user", content: text });
  call();
}

$("#tutorForm").addEventListener("submit", e => { e.preventDefault(); const v = $("#tutorInput").value; $("#tutorInput").value = ""; sendUser(v); });
$("#tutorInput").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && window.matchMedia("(min-width: 760px)").matches) { e.preventDefault(); $("#tutorForm").requestSubmit(); } });
$("#tutorFinish").onclick = () => {
  if (T.busy || T.mode !== "check") return;
  const key = T.scope;
  P.checks[key] = new Date().toISOString().slice(0, 10); save();
  sendUser("I'm done for now. Give me my summary: what I clearly understand, and exactly what to revise.");
};

function showError(err) {
  let t = $("#errToast");
  if (!t) { t = document.createElement("div"); t.id = "errToast"; t.className = "err-toast"; t.setAttribute("role", "alert"); document.body.appendChild(t); }
  t.textContent = "Something broke: " + (err && (err.message || err.reason || err) || "unknown error") + ". Send me this message.";
  t.hidden = false;
  clearTimeout(t._h); t._h = setTimeout(() => { t.hidden = true; }, 12000);
}
window.addEventListener("error", e => showError(e.error || e.message));
window.addEventListener("unhandledrejection", e => showError(e.reason));

window.addEventListener("hashchange", route);
loadLocal();
route();
initSync();
</script>
